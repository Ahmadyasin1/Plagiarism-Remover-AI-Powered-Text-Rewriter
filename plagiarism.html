<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plagiarism Removal</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <style>
        .textarea-container {
            position: relative;
            margin-top: 1.5rem;
        }
        .copy-button {
            display: block;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header text-center">
                        <h2>Plagiarism Removal</h2>
                    </div>
                    <div class="card-body">
                        <form action="/" method="post">
                            <div class="form-group">
                                <label for="input_text">Enter text to remove plagiarism:</label>
                                <textarea class="form-control" id="input_text" name="input_text" rows="5" required>{{ input_text if request.method == 'POST' else '' }}</textarea>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Remove Plagiarism</button>
                        </form>
                        {% if result_text %}
                        <div class="textarea-container">
                            <h4>Original Text:</h4>
                            <textarea class="form-control" rows="5" readonly>{{ input_text }}</textarea>
                        </div>
                        <div class="textarea-container">
                            <h4 class="mt-3">Text after Plagiarism Removal:</h4>
                            <textarea id="output_text" class="form-control" rows="5" readonly>{{ result_text }}</textarea>
                            <button class="btn btn-secondary copy-button" onclick="copyText()">Copy</button>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function copyText() {
            var copyText = document.getElementById("output_text");
            copyText.select();
            copyText.setSelectionRange(0, 99999); /* For mobile devices */
            document.execCommand("copy");
            alert("Copied the text: " + copyText.value);
        }
    </script>
</body>
</html>
